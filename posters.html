<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Music Poster Studies — Gargi Tripathi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#171316; --paper:#f5efe4; --wine:#6d1732; --acid:#cbf265; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--paper); color:var(--ink); font-family:"DM Mono", monospace; }
      header { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:20px 4vw; border-bottom:1.5px solid var(--ink); }
      header a { color:inherit; text-decoration:none; font-size:11px; text-transform:uppercase; }
      h1 { margin:0; padding:clamp(42px,8vw,105px) 4vw clamp(35px,5vw,72px); font:400 clamp(43px,7vw,100px)/.98 "Libre Baskerville", Georgia, serif; letter-spacing:-.075em; }
      h1 em { color:var(--wine); }
      .grid { columns:3 280px; gap:18px; padding:0 4vw 6vw; }
      figure { margin:0 0 18px; break-inside:avoid; border:1.5px solid var(--ink); background:var(--ink); box-shadow:5px 5px 0 var(--wine); }
      img { display:block; width:100%; height:auto; }
      figcaption { padding:10px; color:var(--paper); font-size:10px; text-transform:uppercase; }
    </style>
  </head>
