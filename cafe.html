<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonbrew Café Campaign — Gargi Tripathi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#120d18; --paper:#f4ecdf; --gold:#d7b36a; }
      * { box-sizing:border-box; }
      body { margin:0; color:var(--paper); background:var(--ink); font-family:"DM Mono", monospace; }
      header { display:flex; justify-content:space-between; gap:20px; padding:20px 4vw; border-bottom:1px solid rgba(215,179,106,.75); font-size:11px; text-transform:uppercase; }
      a { color:inherit; text-decoration:none; }
      h1 { margin:0; padding:clamp(42px,8vw,110px) 4vw clamp(35px,5vw,72px); color:var(--gold); font:400 clamp(43px,7vw,100px)/.96 "Libre Baskerville", Georgia, serif; letter-spacing:-.075em; }
      h1 em { color:var(--paper); }
      .grid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:18px; align-items:stretch; padding:0 4vw 6vw; }
      figure { display:grid; grid-template-rows:minmax(0, 1fr) auto; aspect-ratio:3 / 4; margin:0; overflow:hidden; border:1px solid rgba(215,179,106,.75); background:#000; }
      img { display:block; width:100%; height:100%; object-fit:contain; background:#000; }
      figcaption { padding:11px; color:var(--gold); font-size:10px; text-transform:uppercase; }
      @media (max-width:720px) { .grid { grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <header><a href="index.html">← Back to portfolio</a><span>Gargi Tripathi · Brand campaign</span></header>
    <h1>Moonbrew.<br /><em>Coffee, magic, yours.</em></h1>
    <main class="grid">
      <figure><img src="assets/cafe/moonbrew-menu.png" alt="Moonbrew coffee menu design" /><figcaption>Menu system</figcaption></figure>
      <figure><img src="assets/cafe/moonbrew-hero.png" alt="Moonbrew coffee hero campaign visual" /><figcaption>Hero campaign visual</figcaption></figure>
      <figure><img src="assets/cafe/moonbrew-system.png" alt="Moonbrew brand collateral design" /><figcaption>Brand touchpoints</figcaption></figure>
    </main>
  </body>
</html>
